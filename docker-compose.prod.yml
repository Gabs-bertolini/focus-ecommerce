services:
  web:
    image: ghcr.io/gabs-bertolini/focus-web:${WEB_TAG}
    restart: unless-stopped

    networks:
      - backend

    environment:
      NEXT_PUBLIC_API_URL: http://api:3001

    ports:
      - "3000:3000"

    depends_on:
      api:
        condition: service_started

  api:
    image: ghcr.io/gabs-bertolini/focus-api:${API_TAG}
    restart: unless-stopped

    networks:
      - backend

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "3001:3001"

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15
    container_name: ecommerce-postgres
    restart: unless-stopped

    networks:
      - backend

    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - postgres_data:/var/lib/postgresql/data

networks:
  backend:
    driver: bridge

volumes:
  postgres_data: